<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Carousel Premium - Jiu-Jitsu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-blur"></div>

<div class="app">

  <header class="topbar">
    <div class="logo">🔥 Premium Album</div>
    <div class="counter"><span id="current">1</span>/11</div>
  </header>

  <section class="viewer">

    <button class="nav left" onclick="prevSlide()">❮</button>

    <div class="frame">
      <img id="mainImage" src="img/foto1.jpg">
      <div class="shine"></div>
      <div class="caption">
        <h1 id="titulo-foto">Equipe Jiu-Jitsu</h1>
        <p id="desc-foto">treino semanal.</p>
      </div>
    </div>

    <button class="nav right" onclick="nextSlide()">❯</button>

  </section>

  <section class="thumbs">
    <img src="img/foto1.jpg" class="active" onclick="goTo(0)">
    <img src="img/foto2.jpg" onclick="goTo(1)">
    <img src="img/foto3.jpg" onclick="goTo(2)">
    <img src="img/foto4.jpg" onclick="goTo(3)">
    <img src="img/foto5.jpg" onclick="goTo(4)">
    <img src="img/foto6.jpg" onclick="goTo(5)">
    <img src="img/foto7.jpg" onclick="goTo(6)">
    <img src="img/foto8.jpg" onclick="goTo(7)">
    <img src="img/foto9.jpg" onclick="goTo(8)">
    <img src="img/foto8.jpg" onclick="goTo(7)">
    <img src="img/foto9.jpg" onclick="goTo(8)">
    <img src="img/foto10.jpg" onclick="goTo(9)">
    <img src="img/foto11.jpg" onclick="goTo(10)">
  </section>

</div>

<script src="js/script.js"></script>
</body>
</html>
