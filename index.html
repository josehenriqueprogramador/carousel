<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carousel Premium</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-blur"></div>

<div class="app">

  <header class="topbar">
    <div class="logo">🔥 Premium Album</div>
    <div class="counter"><span id="current">1</span>/4</div>
  </header>

  <section class="viewer">

    <button class="nav left" onclick="prevSlide()">❮</button>

    <div class="frame">
      <img id="mainImage" src="img/foto1.jpg">
      <div class="shine"></div>
      <div class="caption">
        <h1>Equipe Jiu-Jitsu</h1>
        <p>Carrossel premium estilo rede social.</p>
      </div>
    </div>

    <button class="nav right" onclick="nextSlide()">❯</button>

  </section>

  <section class="thumbs">
    <img src="img/foto1.jpg" class="active" onclick="goTo(0)">
    <img src="img/foto2.jpg" onclick="goTo(1)">
    <img src="img/foto3.jpg" onclick="goTo(2)">
    <img src="img/foto4.jpg" onclick="goTo(3)">
  </section>

  <section class="actions">
    <button onclick="toggleAuto()">⏯ Auto</button>
    <button onclick="toggleMusic()">🎵 Música</button>
    <button onclick="fullscreen()">📱 Tela Cheia</button>
  </section>

</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b1d7d6c3.mp3?filename=sport-rock-trailer-112975.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>
</body>
</html>
